name: Java Build
on: workflow_dispatch
jobs:
  Build:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Build Api gateway
        run: |
          cd api-gateway
          mvn clean install
