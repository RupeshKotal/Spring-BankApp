name: Java Build
on: workflow_dispatch
jobs:
  Build:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache dependency
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-cache

      - name: Build Api gateway
        run: |
          cd api-gateway
          mvn clean install -DskipTests

      - name: Upload adtrifact
        uses: actions/upload-artifact@v4
        with:
           name: api-jar
           path: api-gateway/target/*.jar


      - name: Login Dockerhub
        run: |
          echo echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Docker build
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/api-gateway:latest .


      - name: Docker push
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/apigateway:latest

          
